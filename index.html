<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spring Boot Guide</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="A step-by-step, beginner-friendly Spring Boot guide. Phase 1 builds a Student Management CRUD API with Spring Web, Spring Data JPA and PostgreSQL.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Docsify theme (Vue style) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    :root {
      --theme-color: #4e8a2d;
    }
    .markdown-section code {
      border-radius: 4px;
    }
    .markdown-section pre > code {
      border-radius: 6px;
    }
    .sidebar-nav > ul > li > p,
    .sidebar-nav > ul > li > strong {
      font-weight: 700;
    }
    .sidebar-nav > ul > li > a {
      font-weight: 600;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    /* Coverpage */
    section.cover.show {
      background: linear-gradient(135deg, #f4fbef 0%, #e3f2d8 100%) !important;
    }
    section.cover h1 {
      color: #2f5a18;
    }
    section.cover .cover-main > p:last-child a:first-child {
      background-color: var(--theme-color);
      color: #fff;
    }
    /* "Coming soon" label in the sidebar */
    .sidebar-nav .soon {
      color: #999;
      font-style: italic;
    }
    /* HTTP method badges */
    .method {
      display: inline-block;
      min-width: 58px;
      padding: 1px 6px;
      border-radius: 4px;
      color: #fff;
      font-size: 0.8em;
      font-weight: 700;
      text-align: center;
    }
    .method.get { background: #2b7bb9; }
    .method.post { background: #4e8a2d; }
    .method.put { background: #c77c02; }
    .method.delete { background: #c0392b; }
  </style>
</head>
<body>
  <div id="app">Loading Spring Boot Guide...</div>
  <script>
    window.$docsify = {
      name: 'Spring Boot Guide',
      // Replace with your own repo once you push this to GitHub, e.g.
      // 'https://github.com/your-username/springboot'
      repo: '',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 2,
      auto2top: true,
      coverpage: true,
      onlyCover: false,
      homepage: 'README.md',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search the guide...',
        noData: 'No results found.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true
      },
      count: {
        countable: true,
        position: 'top'
      }
    }
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-count/dist/countable.js"></script>

  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-properties.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-http.min.js"></script>
</body>
</html>
